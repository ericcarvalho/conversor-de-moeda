<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <title>Conversor de Moedas</title>
</head>

<body>
    <img src="./assets/logo.gif" alt="logo.gif" />
    <main>
        <label>
            converter <b>de</b>
            <select>
                <options>R$ Real Brasileiro</options>
            </select>
        </label>
        
        <label>
            converter <b>para</b>
            <select>
                <options>€ Euro</options>
                <options>US$ Dólar Americano</options>
            </select>
        </label>
        
        <label>valor
            <input placeholder="10.000" />
        </label>
        <button>Converter</button>

        <section>
            <div>
                <img src="./assets/bandeiraBrasil.png" alt="logo-moeda-a-conveter" />
                <p>Real</p>
                <p>R$ 0,00</p>
            </div>
            <img src="./assets/arrow.png" alt="seta" />
            <div>
                <img src="./assets/bandeiraUSA.png" alt="logo-moeda-convertida" />
                <p>Dólar Americano</p>
                <p>US$ 0,00</p>
            </div>
        </section>
    </main>

</body>

</html>
