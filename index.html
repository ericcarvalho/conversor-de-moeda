<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Moedas</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./scripts.js" defer></script>
</head>

<body>
  <header>
    <img class="logo" src="./assets/logo.gif" alt="Logo Conversor" />
    <h1>Conversor de Moedas</h1>
  </header>

  <main>
    <form class="converter-form">
      <label>
        Converter <b>de</b>
        <select class="currency-select-to-convert">
          <option value="BRL">R$ Real Brasileiro</option>
          <option value="USD">US$ Dólar Americano</option>
          <option value="EUR">€ Euro</option>
          <option value="GBP">£ Libra Esterlina</option>
          <option value="JPY">¥ Iene Japonês</option>
          <option value="CAD">C$ Dólar Canadense</option>
          <option value="AUD">A$ Dólar Australiano</option>
          <option value="CHF">CHF Franco Suíço</option>
        </select>
      </label>

      <label>
        Valor
        <input class="input-currency" type="number" placeholder="1000" />
      </label>
      
      <label>
        Converter <b>para</b>
        <select class="currency-select">
          <option value="USD">US$ Dólar Americano</option>
          <option value="EUR">€ Euro</option>
          <option value="GBP">£ Libra Esterlina</option>
          <option value="JPY">¥ Iene Japonês</option>
          <option value="CAD">C$ Dólar Canadense</option>
          <option value="AUD">A$ Dólar Australiano</option>
          <option value="CHF">CHF Franco Suíço</option>
        </select>
      </label>



      <button type="button" class="convert-button">Converter</button>
    </form>

    <section class="result">
      <div class="currency-box">
        <img id="to-convert-bandeira" class="currency-img-to-convert" src="./assets/bandeiraBrasil.png" alt="Bandeira Brasil" />
        <p class="currency-name" id="currency-name-to-convert">Real</p>
        <p class="currency-value-to-convert">R$ 0,00</p>
      </div>

      <img class="arrow" src="./assets/arrow.png" alt="Seta" />

      <div class="currency-box">
        <img id="converted-bandeira" class="currency-img" src="./assets/bandeiraUSA.png"
          alt="Bandeira Moeda Convertida" />
        <p class="currency" id="currency-name">Dólar Americano</p>
        <p class="currency-value">US$ 0.00</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Conversor de Moedas</p>
  </footer>
</body>

</html>
